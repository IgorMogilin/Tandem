[project]
name = "tandem"
version = "0.1.0"
description = "Приложение для учета и контроля расхода оборотных средств."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Igor Mogilin", email = "endless8space@gmail.com"},
    {name = "Anastasia Dekapolceva", email = "deka0665@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".git", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "E501", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
